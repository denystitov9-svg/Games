<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Pit – Free Browser Games</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap"
    />
    <style>
      :root {
        --ink: #14122b;
        --card: #201d47;
        --line: #34306b;
        --text: #f3f1ff;
        --dim: #a9a5d6;
        --yellow: #ffd23f;
        --coral: #ff5c7a;
        --mint: #3ddbb0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--text);
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 48px;
      }
      .logo {
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: var(--yellow);
      }
      h1 {
        font-size: clamp(2.6rem, 9vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        margin: 0 0 16px;
        font-weight: 800;
        max-width: 11ch;
      }
      .sub {
        color: var(--dim);
        max-width: 44ch;
        margin: 0 0 48px;
        font-size: 1.1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 18px;
      }
      .game {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        text-align: left;
        color: inherit;
        font: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .game:hover,
      .game:focus-visible {
        border-color: var(--c);
        outline: none;
      }
      .game .ico {
        font-size: 2.6rem;
        line-height: 1;
      }
      .game b {
        font-size: 1.3rem;
      }
      .game small {
        color: var(--dim);
      }
      #stage {
        display: none;
        margin-top: 8px;
      }
      #stage.on {
        display: block;
      }
      #stage.on ~ .grid,
      #stage.on ~ .hero {
        display: none;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
      }
      .bar h2 {
        margin: 0;
        font-size: 1.6rem;
      }
      button.btn {
        background: var(--yellow);
        color: var(--ink);
        border: 0;
        border-radius: 10px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button.btn:focus-visible {
        outline: 3px solid var(--text);
      }
      #area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .score {
        color: var(--dim);
        font-size: 1.1rem;
      }
      canvas {
        background: #0d0b21;
        border: 2px solid var(--line);
        border-radius: 12px;
        max-width: 100%;
        touch-action: none;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        width: min(360px, 100%);
      }
      .mem {
        aspect-ratio: 1;
        font-size: 2rem;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--line);
        color: transparent;
        cursor: pointer;
      }
      .mem.up {
        background: var(--card);
        color: inherit;
      }
      .mem.done {
        background: var(--mint);
        color: var(--ink);
        border-color: var(--mint);
      }
      .ttt {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: min(300px, 100%);
      }
      .ttt button {
        aspect-ratio: 1;
        font:
          800 2.8rem "Bricolage Grotesque",
          sans-serif;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        color: var(--yellow);
        cursor: pointer;
      }
      .ttt button:nth-child(n) {
        color: var(--yellow);
      }
      .ttt .o {
        color: var(--coral);
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        gap: 6px;
      }
      .pad button {
        height: 56px;
        border-radius: 10px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 1.3rem;
      }
      .pad button:nth-child(1) {
        grid-column: 2;
      }
      .pad button:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
      }
      .pad button:nth-child(3) {
        grid-column: 2;
        grid-row: 2;
      }
      .pad button:nth-child(4) {
        grid-column: 3;
        grid-row: 2;
      }
      @media (hover: hover) {
        .pad {
          display: none;
        }
      }
      .g2048 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        width: min(340px, 100%);
        background: var(--line);
        padding: 8px;
        border-radius: 12px;
      }
      .g2048 div {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.6rem;
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
      }
      .mines {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 3px;
        width: min(360px, 100%);
      }
      .mines button {
        aspect-ratio: 1;
        border-radius: 6px;
        border: 0;
        background: var(--line);
        color: var(--text);
        font: 800 1rem sans-serif;
        padding: 0;
        cursor: pointer;
      }
      .mines button.r {
        background: var(--card);
      }
      .mines button.x {
        background: var(--coral);
      }
      .moles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: min(300px, 100%);
      }
      .moles button {
        aspect-ratio: 1;
        border-radius: 50%;
        border: 3px solid var(--line);
        background: #0d0b21;
        font-size: 2.4rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">Pixel<span>Pit</span></div>
      </header>
      <section id="stage" aria-live="polite">
        <div class="bar">
          <h2 id="title"></h2>
          <button class="btn" id="back">Back to games</button>
        </div>
        <div id="area"></div>
      </section>
      <div class="hero">
        <h1>Pick a game. Play now.</h1>
        <p class="sub">
          Free games that run right in your browser. No download, no sign up.
        </p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
